<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>add-user</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
   
*{
  font-family: tahoma;
}

/* Background color ko halka grayish-white banaya */
.forms {
  background-color:rgb(214, 212, 226); /* White se thoda kam white */
  margin: auto;
  width: 80%;
  max-width: 500px; /* Form ki max width set ki */
  padding: 25px; /* Padding adjust ki */
  border-radius: 20px;
  border: 1px solid blue;
  box-shadow: 9px 8px 10px rgba(0, 0, 0, 0.2); /* Thoda shadow effect */
}

/* Labels aur headings */
label {
  color: #333; /* Thoda dark gray color */
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  font-weight: 600;
}

.forms h2 {
  text-align: center;
  font-size: 2.5em;
  color: blue;
}

/* Input fields */
input {
  width: 100%;
  padding: 10px;
  border-radius: 10px;
  border: 1px solid blue;
  background-color: white;
  box-shadow:9px 8px 10px rgba(0, 0, 0, 0.2);
}

.form-group{
  padding: 7px;
}

input:hover{
  border: 1px solid blue;
}

/* Submit button ko center aur responsive banaya */
.btn {
  display: block;
  width: 30%; /* Button ka width adjust kiya */
  max-width: 200px; /* Button ka max width set ki */
  margin: 20px auto; /* Auto se center me fix kiya */
  padding: 10px;
  border-radius: 10px;
  border: none;
  background-color: blue;
  color: white;
  font-size: 1em;
  cursor: pointer;
  transition: 0.3s ease;
}

.btn:hover {
  background-color: darkblue;
}

/* Responsive Design */
@media (max-width: 768px) {
  .forms {
    width: 90%; /* Chhoti screen par width adjust */
    padding: 20px;
  }

  h2 {
    font-size: 2em;
  }

  .submit-btn {
    width: 80%; /* Button ko chhoti screen par bada kiya */
  }
}

    </style>
</head>
<body>
  <!-- navbar -->
  <div class="sidebar">
    <div class="profile">
        <!-- <img src="images/anklegaming logo.png" alt="Profile"> -->
        <h2>Welcome Admin</h2>
        <!-- <p class="online">● Online </p> -->
    </div>
    <div class="menu">
        <div class="dashboard-item" onclick="location.href='index.html'"><i class="fas fa-tachometer-alt"></i> Dashboard</div>
    </div>
  </div>

<!-- form -->
 
<div class="forms">
  <h2>Apply Now</h2>
  <form action="#" method="post">
    <div class="form-group">
    <label>UserName</label>
    <br>
    <input type="text" name="username" placeholder="Enter your Name" required>
    <br>
  </div>

  <div class="form-group">
    <label>Email</label>
    <br>
    <input type="email" name="email" placeholder="Enter your Email" required>
    <br>
  </div>

  <div class="form-group">
    <label>Phone</label>
    <br>
    <input type="number" name="number" placeholder="Enter your Number" required>
    <br>
  </div>

    <div class="form-group">
    <label>City</label>
    <br>
    <input type="text" name="city" placeholder="Enter your City" required>
    <br>
  </div>

    <div class="form-group">
    <label>Place</label>
    <br>
    <input type="text" name="place" placeholder="Enter your Place" required>
    <br>
  </div>

    <div class="form-group">
    <label>Payment Method</label>
    <br>
    <input type="text" name="payment" placeholder="Enter Payment Method" required>
    <br>
  </div>
    
    <input type="submit" name="submit" value="Submit" class="btn">
  </form>
</div>

       
</body>
</html>
